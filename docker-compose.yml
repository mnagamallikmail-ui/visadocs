services:
  postgres:
    image: postgres:16-alpine
    container_name: PVCPostgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provaluer
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-provaluer}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Mandatory database password required}
    # Security Hardened: Ports removed from host exposure. Accessible strictly within app-network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provaluer -d provaluer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-postgres:
    image: postgres:16-alpine
    container_name: PVCBackupPostgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provaluer_backup
      POSTGRES_USER: ${SPRING_DATASOURCE_BACKUP_USERNAME:-provaluer}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_BACKUP_PASSWORD:?Mandatory backup database password required}
    # Security Hardened: Ports removed from host exposure. Accessible strictly within app-network.
    volumes:
      - backup_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provaluer -d provaluer_backup"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: PVCBackend
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      backup-postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provaluer
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-provaluer}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Mandatory database password required}
      SPRING_DATASOURCE_BACKUP_URL: jdbc:postgresql://backup-postgres:5432/provaluer_backup
      SPRING_DATASOURCE_BACKUP_USERNAME: ${SPRING_DATASOURCE_BACKUP_USERNAME:-provaluer}
      SPRING_DATASOURCE_BACKUP_PASSWORD: ${SPRING_DATASOURCE_BACKUP_PASSWORD:?Mandatory backup password required}
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Mandatory JWT signing secret required}
      DPDP_ENCRYPTION_KEY: ${DPDP_ENCRYPTION_KEY:?Mandatory AES-256 master key required}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-G-94DDGM6XDW}
      MFA_ENFORCEMENT_ENABLED: ${MFA_ENFORCEMENT_ENABLED:-false}
    volumes:
      - lead_storage:/app/storage
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: PVCFrontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  backup_pgdata:
  lead_storage:

networks:
  app-network:
    driver: bridge