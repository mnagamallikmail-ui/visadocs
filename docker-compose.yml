services:
  postgres:
    image: postgres:16-alpine
    container_name: PVCPostgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provaluer
      POSTGRES_USER: provaluer
      POSTGRES_PASSWORD: K1ngcobr@
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provaluer -d provaluer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-postgres:
    image: postgres:16-alpine
    container_name: PVCBackupPostgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provaluer_backup
      POSTGRES_USER: provaluer
      POSTGRES_PASSWORD: K1ngcobr@
    ports:
      - "5435:5432"
    volumes:
      - backup_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provaluer -d provaluer_backup"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: PVCBackend
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      backup-postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provaluer
      SPRING_DATASOURCE_USERNAME: provaluer
      SPRING_DATASOURCE_PASSWORD: K1ngcobr@
      SPRING_DATASOURCE_BACKUP_URL: jdbc:postgresql://backup-postgres:5432/provaluer_backup
      SPRING_DATASOURCE_BACKUP_USERNAME: provaluer
      SPRING_DATASOURCE_BACKUP_PASSWORD: K1ngcobr@
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: 9a62a9386c9135003f42b8e3ea954cfd3a1f9e9d6bc4bf38ea2f6bbd688bfa1f
      GA4_MEASUREMENT_ID: G-94DDGM6XDW
    volumes:
      - lead_storage:/app/storage
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: PVCFrontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  backup_pgdata:
  lead_storage:

networks:
  app-network:
    driver: bridge