# ==============================================================================
# ProValuer Android Distribution & Update Server Block
# Domain: app.provaluer.in
# File: /etc/nginx/sites-available/app.provaluer.in.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.provaluer.in;

    # Let's Encrypt Certificate Renewal Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Permanent Redirect to Canonical HTTPS
    location / {
        return 301 https://app.provaluer.in$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Android Distribution & Version API
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.provaluer.in;

    # Enterprise SSL Certificate Configuration
    # Uses wild-card or shared Let's Encrypt certificate for provaluer.in
    ssl_certificate /etc/letsencrypt/live/provaluer.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provaluer.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Statutory Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Distribution Root
    root /var/www/provaluer;

    # --------------------------------------------------------------------------
    # 1. Public Download Shortcut: https://app.provaluer.in/download
    # 302 Found redirect ensures mobile browsers and download managers never
    # permanently cache older APK binaries across app version upgrades.
    # --------------------------------------------------------------------------
    location = /download {
        return 302 https://app.provaluer.in/download/latest.apk;
    }

    # --------------------------------------------------------------------------
    # 2. Binary APK Delivery: https://app.provaluer.in/download/latest.apk
    # --------------------------------------------------------------------------
    location = /download/latest.apk {
        alias /var/www/provaluer/downloads/latest.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Content-Disposition 'attachment; filename="ProValuer-v1.0.0.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        client_max_body_size 500M;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        keepalive_timeout 65;
    }

    # Direct downloads for versioned APK archives (e.g., /download/app-v1.0.0-101.apk)
    location /download/ {
        alias /var/www/provaluer/downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        client_max_body_size 500M;
        sendfile on;
        tcp_nopush on;
    }

    # --------------------------------------------------------------------------
    # 3. Version Manifest Endpoint: https://app.provaluer.in/app/version.json
    # Queried by field appraiser devices for update checks.
    # --------------------------------------------------------------------------
    location = /app/version.json {
        alias /var/www/provaluer/app/version.json;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # --------------------------------------------------------------------------
    # 4. Mobile Landing Page: https://app.provaluer.in/
    # Mobile web view for valuers scanning QR code or browsing distribution apex
    # --------------------------------------------------------------------------
    location / {
        root /var/www/provaluer/downloads;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }
}

