name: Deploy Visadocs

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'android/**'
      - 'frontend/android/**'

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Client
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          CLEAN_HOST=$(echo "$VPS_SSH_HOST" | tr -d '\r\n ')
          CLEAN_USER=$(echo "$VPS_SSH_USER" | tr -d '\r\n ')
          cat << EOF > ~/.ssh/config
          Host vps-target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to VPS
        run: |
          ssh vps-target << 'REMOTE_SCRIPT'
            set -e
            cd /root/visadocs
            git fetch origin
            git reset --hard origin/master

            docker exec PVCPostgres psql -U provaluer -d provaluer -c "DELETE FROM flyway_schema_history WHERE version = '11' AND success = false;" || true

            docker compose up -d --build
            docker image prune -f
            docker builder prune -f --keep-storage 2GB

            nginx -t && systemctl reload nginx || true

            echo "=== WAITING FOR BACKEND STARTUP ==="
            sleep 15

            echo "=== VPS DIAGNOSTICS ==="
            docker compose ps
            docker logs PVCBackend --tail 50
            curl -i -X POST http://127.0.0.1:8082/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"superadmin@provaluer.com","password":"password"}' || true
            curl -i -X POST https://visadocs.online/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"superadmin@provaluer.com","password":"password"}' || true
          REMOTE_SCRIPT
