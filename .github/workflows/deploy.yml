name: Deploy Visadocs

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m

          script: |
            cd /root/visadocs

            git fetch origin
            git reset --hard origin/master

            # Deploy with production-grade incremental build using Docker cache
            # This rebuilds only changed services and keeps database volumes intact
            docker compose up -d --build

            # Remove dangling images to reclaim disk space
            docker image prune -f

            # Reload host nginx to pick up any config changes
            nginx -t && systemctl reload nginx || true

            echo "=== VPS DIAGNOSTICS ==="
            echo "--- DOCKER CONTAINERS STATUS ---"
            docker compose ps

            echo "--- BACKEND LOGS ---"
            docker logs PVCBackend --tail 200

            echo "--- POSTGRES LOGS ---"
            docker logs PVCPostgres --tail 50

            echo "--- NGINX STATUS & ERROR LOGS ---"
            systemctl status nginx --no-pager || true
            tail -n 50 /var/log/nginx/error.log || true

            echo "--- VPS LOCAL LOGIN CURL TEST ---"
            curl -i -X POST http://127.0.0.1:8082/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"superadmin@provaluer.com","password":"password"}' || true