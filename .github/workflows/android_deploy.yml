name: Android Production Build & Release

on:
  push:
    branches:
      - android
    tags:
      - 'android-v*'

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Step 1 & 2 - Prepare Version Metadata from pubspec.yaml
        run: python scripts/release_manager.py prepare

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Tests
        working-directory: frontend
        run: flutter test || true

      - name: Decode Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      - name: Step 3 - Build Release APK
        working-directory: frontend
        run: flutter build apk --flavor production --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB (App Bundle)
        working-directory: frontend
        run: flutter build appbundle --flavor production --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Step 4, 5, 6 - Package Named APK, version.json, Landing Page & Validate
        run: python scripts/release_manager.py package

      - name: Setup SSH for VPS Deployment
        if: env.VPS_SSH_KEY != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          HOST=$(echo "$VPS_SSH_HOST" | tr -d '\r\n')
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Step 7, 8, 9 - Upload to VPS, Update Symlink & Deploy Landing Page
        if: env.VPS_SSH_HOST != ''
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: python scripts/release_manager.py deploy

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: |
            frontend/build/app/outputs/flutter-apk/*.apk
            frontend/build/app/outputs/bundle/productionRelease/*.aab
            android/distribution/version.json
            android/distribution/index.html

      - name: Deploy to Google Play Internal Testing
        if: startsWith(github.ref, 'refs/tags/android-v') && env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: in.provaluer.app
          releaseFiles: frontend/build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: internal
          status: completed
