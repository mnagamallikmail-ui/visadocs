name: Web Production & VPS Deployment

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'android/**'
      - 'frontend/android/**'

jobs:
  deploy:
    name: Deploy Web to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            cd /root/visadocs
            git fetch origin
            git reset --hard origin/master

            # Clean failed migrations if any
            docker exec -i PVCPostgres psql -U provaluer -d provaluer -c "DELETE FROM flyway_schema_history WHERE version = '11' AND success = false;" || true

            # Build and restart web and backend services with Docker cache
            docker compose up -d --build

            docker image prune -f
            docker builder prune -f --keep-storage 2GB

            # Reload host nginx
            nginx -t && systemctl reload nginx || true

            echo "=== VPS WEB DIAGNOSTICS ==="
            docker compose ps
            curl -i -X POST https://visadocs.online/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"superadmin@provaluer.com","password":"password"}' || true

