# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name visadocs.online www.visadocs.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Proxy traffic to Docker containers
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name visadocs.online www.visadocs.online;

    client_max_body_size 25M;

    # SSL certificate configuration (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/visadocs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visadocs.online/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Gzip Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy /api/ to backend (port 8082)
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts — increased for long-running operations (DOCX generation, PDF conversion)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer sizing for large payloads (0.11 Nginx Buffer Configuration)
        proxy_buffer_size 256k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
        client_max_body_size 0;
    }

    # Proxy everything else to frontend (port 8091)
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
