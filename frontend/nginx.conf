server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Static assets caching (immutable)
    location ~* \.(?:wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2?|otf|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static SEO and bot crawlers (exact file matching)
    location ~* ^/(?:robots\.txt|sitemap\.xml|knowledge-sitemap\.xml|llms\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Pre-rendered static landing pages and directory indexes
    # Checks exact file, exact folder index.html, or falls back to SPA root
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
