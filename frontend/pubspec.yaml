name: provaluer_frontend
description: "A production-ready Flutter Web application for Property Valuation services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.6
  dio: 5.4.0
  go_router: 14.2.0
  provider: 6.1.0
  google_fonts: 8.1.0
  flutter_animate: ^4.5.2
  table_calendar: 3.1.0
  dotted_border: 2.1.0
  data_table_2: 2.7.2
  badges: 3.1.2
  shimmer: ^3.0.0
  fl_chart: 0.66.2
  intl: 0.19.0
  url_launcher: ^6.3.2
  file_picker: ^6.1.1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  animations: ^2.2.0
  lottie: ^3.3.3
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
