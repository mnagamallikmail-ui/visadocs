name: provaluer_frontend
description: "A production-ready Flutter Web application for Property Valuation services."
publish_to: 'none'

version: 1.0.2+103

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.6
  dio: 5.4.0
  go_router: 14.2.0
  provider: 6.1.0
  google_fonts: 8.1.0
  flutter_animate: ^4.5.2
  table_calendar: 3.1.0
  dotted_border: 2.1.0
  data_table_2: 2.7.2
  badges: 3.1.2
  shimmer: ^3.0.0
  fl_chart: 0.66.2
  intl: 0.19.0
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  encrypt: ^5.0.3
  crypto: ^3.0.3
  animations: ^2.2.0
  lottie: ^3.3.3
  video_player: ^2.9.2
  font_awesome_flutter: ^11.0.0
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  share_plus: ^10.1.4
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/hero/
    - assets/videos/
    - assets/videos/hero_story/
