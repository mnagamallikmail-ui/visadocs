server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 512

spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:30MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/provaluer}
    username: ${SPRING_DATASOURCE_USERNAME:provaluer}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Dedicated backup database credentials for immutable audit compliance
    backup:
      url: ${SPRING_DATASOURCE_BACKUP_URL:jdbc:postgresql://localhost:5433/provaluer_backup}
      username: ${SPRING_DATASOURCE_BACKUP_USERNAME:provaluer}
      password: ${SPRING_DATASOURCE_BACKUP_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: false

# Security & Application Settings
app:
  jwt:
    # HMAC-SHA 256-bit signing key (hex encoded) - Mandatory in production
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  mfa:
    enforcement-enabled: ${MFA_ENFORCEMENT_ENABLED:false}
  telegram:
    enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  payment:
    beneficiary-name: ${PAYMENT_BENEFICIARY_NAME:ProValuer Valuation & Advisory Services Pvt Ltd}
    bank-name: ${PAYMENT_BANK_NAME:HDFC Bank Ltd}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:50200088912345}
    ifsc: ${PAYMENT_IFSC:HDFC0001234}
    upi-id: ${PAYMENT_UPI_ID:provaluer.commercial@hdfcbank}
  security:
    encryption:
      enabled: ${DPDP_ENCRYPTION_ENABLED:true}
      master-key: ${DPDP_ENCRYPTION_KEY}
      key-version: ${DPDP_KEY_VERSION:v1-aes256-gcm}
  dpdp:
    dpo:
      name: ${DPDP_DPO_NAME:CS / Adv. R. Parthasarathy}
      title: ${DPDP_DPO_TITLE:Data Protection Officer & Head of Legal}
      email: ${DPDP_DPO_EMAIL:dpo@provaluer.in}
      phone: ${DPDP_DPO_PHONE:+91 40 4912 8800}
      address: ${DPDP_DPO_ADDRESS:11th Floor, Vasavi MPM Grand Mall, Ameerpet, Hyderabad, Telangana - 500073, India}
    grievance-officer:
      name: ${DPDP_GRIEVANCE_OFFICER_NAME:CS / Adv. R. Parthasarathy}
      email: ${DPDP_GRIEVANCE_OFFICER_EMAIL:grievance@provaluer.in}
      phone: ${DPDP_GRIEVANCE_OFFICER_PHONE:+91 40 4912 8800}
      address: ${DPDP_GRIEVANCE_OFFICER_ADDRESS:11th Floor, Vasavi MPM Grand Mall, Ameerpet, Hyderabad, Telangana - 500073, India}
    retention:
      cron: ${DPDP_RETENTION_CRON:0 0 2 * * ?}

