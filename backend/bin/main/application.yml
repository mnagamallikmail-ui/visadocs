server:
  port: 8080

spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/provaluer}
    username: ${SPRING_DATASOURCE_USERNAME:provaluer}
    password: ${SPRING_DATASOURCE_PASSWORD:K1ngcobr@}
    driver-class-name: org.postgresql.Driver
    # Dedicated backup database credentials for immutable audit compliance
    backup:
      url: ${SPRING_DATASOURCE_BACKUP_URL:jdbc:postgresql://localhost:5433/provaluer_backup}
      username: ${SPRING_DATASOURCE_BACKUP_USERNAME:provaluer}
      password: ${SPRING_DATASOURCE_BACKUP_PASSWORD:K1ngcobr@}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true

# Security & Application Settings
app:
  jwt:
    # HMAC-SHA 256-bit signing key (hex encoded)
    secret: 9a62a9386c9135003f42b8e3ea954cfd3a1f9e9d6bc4bf38ea2f6bbd688bfa1f
    expiration-ms: 86400000 # 24 hours

---
# Test Configuration Profile
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
